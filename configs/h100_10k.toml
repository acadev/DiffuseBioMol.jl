# H100 single-device 10k-structure baseline. Install LuxCUDA.jl in the active
# Julia environment, then copy this file and edit only
# `data_dir` before launching. The runner rejects a corpus with fewer than
# 10,000 usable structures and deterministically samples exactly 10,000 if
# the directory contains more.

[data]
data_dir = "CHANGE_ME_TO_A_LOCAL_10K_PDB_DIRECTORY"
max_atoms = 1200
# Retain large source chains and train/evaluate on fixed or epoch-varying
# residue-complete crops within this budget.
oversize_policy = "crop"
crop_strategy = "mixed"
# Defaults to `RUN_DIR/corpus_cache.v4.jls`; use shared storage to reuse this
# one-time CPU preprocessing cost across restarted or follow-on experiments.
# cache_path = "/scratch/diffusebiomol/pdb10k-max1200.jls" # stored as `.v4.jls`
load_progress_every = 25
# Parse at most this many deterministic candidates before retaining 10,000.
# Keep this above 10,000 to allow for malformed or over-budget structures.
max_candidate_files = 12000
max_structures = 10000
min_structures = 10000
validation_fraction = 0.15

[model]
# A meaningful, still conservative baseline: 4 Pairformer-lite and 4 DiT
# blocks. Increase only after this profile clears its held-out gates.
d_single = 64
d_pair = 32
n_heads = 8
n_pairformer_layers = 4
n_dit_layers = 4
d_time = 64
d_hidden_mult = 4

[training]
seed = 20260909
epochs = 50
batch_size = 8
learning_rate = 0.001
checkpoint_every = 5
# Train on fixed contiguous motifs often enough for conditional infilling to
# be in-distribution at evaluation time.
infill_probability = 0.25

[evaluation]
sample_steps = 40
# The same fixed 64 structures are evaluated at ordinary checkpoints; all
# 1,500 held-out structures are evaluated every 25 epochs and at epoch 50.
sentinel_size = 64
full_validation_every = 25
min_rmsd_improvement = 0.0
# Fixed held-out motif evaluation: recover the non-fixed atoms while the motif
# is clamped exactly. This is reported separately in infill_metrics.csv/W&B.
infill_enabled = true
infill_fixed_fraction = 0.2
infill_size = 16

[wandb]
enabled = true
project = "DiffuseBioMol"
entity = "" # set this to your W&B team/entity if applicable
name = "h100-10k-baseline"
upload_checkpoints = true
